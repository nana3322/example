<!DOCTYPE html>
<html lang="ko" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이브코딩 튜토리얼 · 교사 연수</title>
<style>
/* =========================================================
   1. 기본 토큰
   ========================================================= */
*{box-sizing:border-box}
:root{
  --bg:#f3f6fa;
  --paper:#ffffff;
  --ink:#1b2333;
  --muted:#556074;
  --line:#dbe2ec;
  --accent:#2563eb;
  --soft:#e7efff;
  --warn-bg:#fff3e0; --warn-line:#e8890c; --warn-ink:#7a4300;
  --tip-bg:#eaf8ef;  --tip-line:#1f9d55; --tip-ink:#14532d;
  --ok-bg:#e9f5ff;   --ok-line:#1877c9;  --ok-ink:#0b3d6b;
  --code-bg:#1d2433; --code-ink:#e9eef8;
  --header-h:72px;
  --side-w:340px;
  --radius-l:18px; --radius-m:12px; --radius-s:8px;
}
html{font-size:20px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html[data-fs="s"]{font-size:18px}
html[data-fs="l"]{font-size:23px}
html[data-fs="xl"]{font-size:26px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  line-height:1.75;word-break:keep-all;overflow-wrap:break-word;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
code,pre{font-family:"D2Coding","Consolas","Menlo","Courier New",monospace}

/* 단계별 색 */
body.theme-0{--accent:#2563eb;--soft:#e7efff}
body.theme-1{--accent:#15803d;--soft:#e4f5ea}
body.theme-2{--accent:#7c3aed;--soft:#f0e9fe}
body.theme-3{--accent:#c2410c;--soft:#ffeee3}
body.theme-4{--accent:#0f766e;--soft:#e0f4f2}
body.theme-5{--accent:#1e3a8a;--soft:#e6eaf6}

/* =========================================================
   2. 헤더
   ========================================================= */
.header{
  position:fixed;inset:0 0 auto 0;height:var(--header-h);z-index:40;
  display:flex;align-items:center;gap:.6rem;padding:0 1rem;
  background:var(--paper);border-bottom:4px solid var(--accent);
}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.brand-mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;font-size:1.3rem;flex:none}
.brand-short{display:none}
.brand small{font-weight:600;color:var(--muted);font-size:.8rem;margin-left:.3rem}
.hbtn{
  min-height:48px;min-width:48px;padding:0 .8rem;border-radius:var(--radius-m);
  border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:.9rem;
  display:inline-flex;align-items:center;justify-content:center;gap:.3rem;white-space:nowrap
}
.hbtn:hover{border-color:var(--accent)}
.hbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.fs-group{display:flex;align-items:center;gap:.3rem}
.fs-label{min-width:4.2em;text-align:center;font-size:.8rem;color:var(--muted);font-weight:700}

/* =========================================================
   3. 사이드바
   ========================================================= */
.sidebar{
  position:fixed;top:var(--header-h);bottom:0;left:0;width:var(--side-w);z-index:30;
  background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;
  padding:1rem .8rem 2rem;transition:transform .25s ease
}
.progress-box{padding:.8rem .9rem;border-radius:var(--radius-m);background:var(--soft);margin-bottom:1rem}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.progress-top span:last-child{font-size:1.4rem;color:var(--accent)}
.progress-bar{height:14px;border-radius:99px;background:#fff;border:1px solid var(--line);overflow:hidden;margin-top:.4rem}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.progress-sub{font-size:.8rem;color:var(--muted);margin-top:.3rem}
.toc{list-style:none;margin:0;padding:0}
.toc>li{margin-bottom:.35rem}
.lesson-btn{
  width:100%;min-height:56px;display:flex;align-items:center;gap:.6rem;text-align:left;
  padding:.5rem .7rem;border-radius:var(--radius-m);border:2px solid transparent;background:none
}
.lesson-btn:hover{background:#f4f6fa}
.lesson-btn.active{border-color:var(--accent);background:var(--soft)}
.lesson-ico{font-size:1.4rem;flex:none;width:1.6em;text-align:center}
.lesson-txt{flex:1;line-height:1.35}
.lesson-txt b{display:block;font-size:.95rem}
.lesson-txt small{color:var(--muted);font-size:.78rem}
.lesson-count{font-size:.78rem;font-weight:800;color:var(--muted);flex:none}
.lesson-count.full{color:var(--tip-line)}
.subs{list-style:none;margin:.3rem 0 .6rem;padding:0 0 0 1.2rem;border-left:3px solid var(--soft);margin-left:1.2rem}
.sub-btn{
  width:100%;min-height:48px;display:flex;align-items:center;gap:.5rem;text-align:left;
  padding:.35rem .6rem;border:none;background:none;border-radius:var(--radius-s);font-size:.88rem;line-height:1.35
}
.sub-btn:hover{background:#f4f6fa}
.sub-btn.current{background:var(--accent);color:#fff;font-weight:700}
.sub-mark{flex:none;width:1.5em;height:1.5em;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;background:#fff;color:var(--ink)}
.sub-mark.done{background:var(--tip-line);border-color:var(--tip-line);color:#fff}
.side-foot{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--line)}
.reset-btn{width:100%;min-height:48px;border-radius:var(--radius-m);border:2px dashed #c9d2df;background:none;color:var(--muted);font-weight:700;font-size:.88rem}
.reset-btn:hover{border-color:#d33;color:#b42318}
.side-hint{font-size:.78rem;color:var(--muted);margin-top:.6rem;line-height:1.5}
.backdrop{display:none;position:fixed;inset:var(--header-h) 0 0 0;background:rgba(15,23,42,.45);z-index:25}

/* =========================================================
   4. 본문
   ========================================================= */
.main{margin-left:var(--side-w);padding:calc(var(--header-h) + 1.6rem) 2rem 2rem;min-height:100vh;transition:margin .25s ease}
.content{max-width:980px;margin:0 auto}
.crumb{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.6rem}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .8rem;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:800;font-size:.85rem}
.pill.plain{background:#fff;border:1px solid var(--line);color:var(--muted)}
.page-title{display:flex;align-items:flex-start;gap:.8rem;margin:.2rem 0 1.2rem}
.page-num{flex:none;font-size:1.1rem;font-weight:900;color:#fff;background:var(--accent);border-radius:14px;padding:.35rem .7rem;line-height:1.3;margin-top:.35rem}
h1{font-size:2rem;line-height:1.3;margin:0;letter-spacing:-.02em}
h1:focus{outline:none}
.section-body h2{font-size:1.3rem;margin:2rem 0 .7rem;line-height:1.4;letter-spacing:-.01em}
.section-body h3{font-size:1.1rem;margin:1.4rem 0 .5rem}
.section-body p{margin:.6rem 0}
.section-body ul{padding-left:1.3rem}
.section-body li{margin:.3rem 0}
.lead{font-size:1.1rem}

.goal{background:var(--paper);border:2px solid var(--accent);border-left-width:10px;border-radius:var(--radius-m);padding:.9rem 1.2rem;margin-bottom:1.4rem}
.goal b{display:block;color:var(--accent);font-size:.85rem}
.goal p{margin:.15rem 0 0!important;font-size:1.15rem;font-weight:700;line-height:1.55}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-l);padding:.4rem 1.3rem 1.1rem;margin:1.2rem 0}
.panel>h2:first-child{margin-top:.9rem}

/* 따라하기 번호 목록 */
ol.steps{list-style:none;counter-reset:st;padding:0;margin:.4rem 0}
ol.steps>li{counter-increment:st;position:relative;padding:.55rem 0 .55rem 3.2rem;min-height:2.6rem;border-bottom:1px dashed var(--line)}
ol.steps>li:last-child{border-bottom:none}
ol.steps>li::before{
  content:counter(st);position:absolute;left:0;top:.45rem;width:2.3rem;height:2.3rem;border-radius:50%;
  background:var(--soft);color:var(--accent);font-weight:900;display:grid;place-items:center;font-size:1rem
}
ol.steps>li.key::before{background:var(--accent);color:#fff}
.kbd,.ui{padding:0 .45em;border-radius:6px;font-weight:700}
.kbd{display:inline-block;white-space:nowrap}
.ui{display:inline;background:#eef1f6;border:1px solid #cfd7e3;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.9}
.kbd{background:#fff;border:1px solid #b8c2d0;border-bottom-width:3px;font-family:inherit;font-size:.9em}

/* 그림 자리 */
.fig{
  margin:1rem 0;min-height:150px;border-radius:var(--radius-m);background:repeating-linear-gradient(135deg,#eceff4 0 14px,#e5e9f0 14px 28px);
  border:2px dashed #b9c3d1;display:grid;place-items:center;text-align:center;padding:1rem;color:#5d6778;font-weight:700
}

/* 안내 상자 */
.callout{border-radius:var(--radius-m);padding:1rem 1.2rem;margin:1.2rem 0;border-left:8px solid}
.callout-title{font-weight:900;font-size:1.08rem;margin-bottom:.3rem}
.callout p:first-child{margin-top:0}
.callout ul,.callout ol{margin:.4rem 0}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.callout.warn.big{border-width:2px 2px 2px 10px;border-style:solid}
.callout.tip{background:var(--tip-bg);border-color:var(--tip-line);color:var(--tip-ink)}
.callout.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.callout .steps>li{border-bottom-color:rgba(0,0,0,.12)}
.callout .steps>li::before{background:#fff}

/* 추가 요소 */
a.ext{color:var(--accent);font-weight:800;text-decoration:underline;word-break:break-all}
.sn{display:block;margin-top:.25rem;font-size:.85em;color:var(--muted);font-weight:600;line-height:1.55}
.callout .sn{color:inherit;opacity:.85}
.goal p.goal-note{margin-top:.55rem!important;font-size:.95rem;font-weight:600;color:var(--muted)}
.ok-note{margin:.7rem 0 0;font-weight:800}
.star{margin:.5rem 0 0!important;font-weight:700;color:var(--muted)}
.chips.list{flex-direction:column;align-items:stretch}
.chips.list .chip{width:100%;text-align:left;justify-content:flex-start;border-radius:var(--radius-m)}
.chip.on{background:var(--accent);color:#fff}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.6rem 0}
.pick .chip{border-radius:var(--radius-m);min-height:56px}
.pick-result{margin:.7rem 0 0;font-weight:800}
.jump-wrap{text-align:center;margin:.2rem 0 1rem}
.jump-btn{min-height:60px;padding:.4rem 1.6rem;border-radius:var(--radius-m);border:3px solid var(--accent);background:var(--accent);color:#fff;font-weight:900;font-size:1.05rem;max-width:100%}
.jump-btn:hover{filter:brightness(1.1)}
.ba{margin:1rem 0;display:grid;gap:.4rem}
.ba-box{border-radius:var(--radius-m);padding:.7rem .9rem;border:2px solid}
.ba-box.bad{border-color:#e2a3a3;background:#fff7f7}
.ba-box.good{border-color:#8fd1a8;background:#f3fbf6}
.ba-tag{font-weight:900;margin-bottom:.3rem}
.ba-code{margin:0;padding:.7rem .8rem;background:var(--code-bg);color:var(--code-ink);border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:.82rem;line-height:1.8}
.ba-code mark{border-radius:4px;padding:0 .2em;color:#111}
.ba-code mark.del{background:#ffb4b4;text-decoration:line-through}
.ba-code mark.add{background:#9be7b4}
.ba-arrow{text-align:center;font-size:1.4rem;line-height:1}
.ba-box p{margin:.5rem 0 0!important}
.ba-note{margin:.2rem 0 0!important;font-weight:800;color:var(--warn-ink)}
@media (max-width:640px){.pick{grid-template-columns:1fr}.jump-btn{width:100%}}

/* 표 */
.tbl-wrap{overflow-x:auto;margin:1rem 0;border-radius:var(--radius-m);border:1px solid var(--line);background:var(--paper)}
table.tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
.tbl th,.tbl td{padding:.7rem .8rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:800;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:700}

/* 흐름도 */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin:1rem 0}
.flow .node{background:var(--paper);border:2px solid var(--accent);border-radius:var(--radius-m);padding:.35rem .8rem;font-weight:800}
.flow .arrow{color:var(--accent);font-weight:900;font-size:1.2rem}

/* 비교 카드 */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.8rem 0}
.compare>div{border-radius:var(--radius-m);padding:.8rem 1rem;border:2px solid}
.compare .bad{border-color:#e2a3a3;background:#fff5f5}
.compare .good{border-color:#8fd1a8;background:#f2fbf5}
.compare b{display:block;margin-bottom:.2rem}

/* 코드 상자 */
.code{margin:1.1rem 0;border-radius:var(--radius-m);overflow:hidden;border:1px solid #0e1320;background:var(--code-bg)}
.code-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.45rem .5rem .45rem 1rem;background:#2b3448;color:#dfe6f3;font-weight:800;font-size:.9rem}
.copy-btn{
  min-height:48px;min-width:7.5em;padding:0 1rem;border-radius:10px;border:none;background:#fff;color:#1d2433;font-weight:900;font-size:.92rem;flex:none
}
.copy-btn:hover{background:#ffe08a}
.copy-btn.copied{background:#22c55e;color:#fff}
.code pre{margin:0;padding:1rem 1.1rem;overflow-x:auto;max-height:520px;overflow-y:auto;color:var(--code-ink);font-size:.8rem;line-height:1.6;white-space:pre;tab-size:2}
.code pre.wrap{white-space:pre-wrap;word-break:keep-all}
pre.plain{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:1rem;overflow-x:auto;font-size:.85rem;line-height:1.6}

/* 도우미 도구 */
.tool{background:var(--paper);border:3px solid var(--accent);border-radius:var(--radius-l);padding:.4rem 1.3rem 1.2rem;margin:1.4rem 0}
.field{display:block;margin:.9rem 0;border:none;padding:0}
.field>span,.field>legend{display:block;font-weight:800;margin-bottom:.3rem;padding:0}
.field input[type=text],.field select,.field textarea{
  width:100%;min-height:52px;padding:.55rem .8rem;border-radius:var(--radius-m);border:2px solid var(--line);background:#fbfcfe
}
.field textarea{min-height:120px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.checks{display:flex;flex-wrap:wrap;gap:.5rem}
.check{display:inline-flex;align-items:center;gap:.5rem;min-height:48px;padding:.3rem .8rem;border-radius:var(--radius-m);border:2px solid var(--line);background:#fbfcfe;cursor:pointer;line-height:1.4}
.check input{width:1.3em;height:1.3em;accent-color:var(--accent);flex:none}
.checks.col{flex-direction:column}
.checks.col .check{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.chip{min-height:48px;padding:0 1rem;border-radius:99px;border:2px solid var(--accent);background:var(--soft);color:var(--accent);font-weight:800}
.chip:hover{background:var(--accent);color:#fff}

/* 용어 사전 */
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem;margin:1rem 0}
.term{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:.8rem 1rem}
.term b{font-size:1.05rem;color:var(--accent)}
.term p{margin:.3rem 0 0!important;font-size:.92rem}
.term .like{color:var(--muted);font-size:.85rem}

/* 완료 버튼 + 이동 */
.done-wrap{margin:2.2rem 0 1rem;text-align:center}
.done-btn{min-height:60px;padding:0 2rem;border-radius:99px;border:3px solid var(--tip-line);background:#fff;color:var(--tip-ink);font-weight:900;font-size:1.05rem}
.done-btn:hover{background:var(--tip-bg)}
.done-btn.is-done{background:var(--tip-line);color:#fff}
.pager{position:sticky;bottom:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.8rem 0;margin-top:1rem;background:linear-gradient(to top,var(--bg) 70%,rgba(243,246,250,0))}
.nav-btn{min-height:56px;padding:0 1.3rem;border-radius:var(--radius-m);border:2px solid var(--accent);background:var(--paper);color:var(--accent);font-weight:900;font-size:1rem}
.nav-btn.next{background:var(--accent);color:#fff}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.pos{color:var(--muted);font-weight:800;font-size:.9rem}

/* 모달, 토스트 */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:var(--radius-l);padding:1.4rem 1.5rem;max-width:520px;width:100%}
.modal h2{margin:0 0 .6rem;font-size:1.25rem}
.modal-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.btn{min-height:52px;padding:0 1.3rem;border-radius:var(--radius-m);border:2px solid var(--line);background:#fff;font-weight:800}
.btn.danger{background:#c62828;border-color:#c62828;color:#fff}
.toast{position:fixed;left:50%;bottom:1.5rem;visibility:hidden;transform:translateX(-50%) translateY(calc(100% + 3rem));background:#1d2433;color:#fff;padding:.9rem 1.3rem;border-radius:var(--radius-m);z-index:90;font-weight:700;max-width:92vw;transition:transform .25s ease;text-align:center}
.toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}

/* =========================================================
   5. 화면 크기별
   ========================================================= */
body.side-collapsed .sidebar{transform:translateX(-100%)}
body.side-collapsed .main{margin-left:0}
@media (max-width:1100px){:root{--side-w:290px}.main{padding-left:1.4rem;padding-right:1.4rem}}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);width:min(88vw,360px);box-shadow:none}
  body.side-open .sidebar{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  body.side-open .backdrop{display:block}
  .main{margin-left:0!important}
  .brand-short{display:none}
.brand small{display:none}
}
@media (max-width:640px){
  /* 휴대폰: 기본 글자를 한 단계 낮춰 한 화면에 더 많이 보이게 */
  html{font-size:17px}
  html[data-fs="s"]{font-size:15px}
  html[data-fs="l"]{font-size:19px}
  html[data-fs="xl"]{font-size:22px}
  :root{--header-h:60px}
  body{line-height:1.65}

  .header{gap:.35rem;padding:0 .5rem;border-bottom-width:3px}
  .brand-mark{display:none}
  .brand-long{display:none}
  .brand-short{display:inline}
  .hbtn{padding:0 .5rem;font-size:.85rem}
  .hbtn .txt{display:none}
  .fs-label{display:none}

  .main{padding:calc(var(--header-h) + .9rem) .9rem 0}
  .crumb{gap:.35rem;margin-bottom:.4rem}
  .pill{font-size:.78rem;padding:.1rem .65rem}
  .page-title{gap:.55rem;margin:.1rem 0 1rem}
  .page-num{font-size:.85rem;padding:.2rem .5rem;border-radius:10px;margin-top:.2rem}
  h1{font-size:1.45rem}
  .section-body h2{font-size:1.15rem;margin:1.5rem 0 .5rem}
  .lead{font-size:1rem}

  .goal{padding:.75rem .9rem;border-left-width:8px;margin-bottom:1rem}
  .goal p{font-size:1.05rem}
  .panel{padding:.2rem .95rem .8rem;border-radius:var(--radius-m);margin:1rem 0}
  .tool{padding:.2rem .95rem 1rem;border-width:2px;border-radius:var(--radius-m)}
  .callout{padding:.8rem .95rem;border-left-width:6px}
  .callout.warn.big{border-width:2px 2px 2px 8px}

  ol.steps>li{padding:.45rem 0 .45rem 2.5rem;min-height:2.2rem}
  ol.steps>li::before{width:1.85rem;height:1.85rem;font-size:.85rem;top:.45rem}

  .compare{grid-template-columns:1fr}
  .fig{min-height:96px;font-size:.85rem}
  .flow{flex-direction:column;align-items:flex-start;gap:.15rem}

function doGet(e) {
  const sheet = getSheet_();
  const values = sheet.getDataRange().getValues();
  const rows = values.slice(1).map(function (r) {
    return {

function doPost(e) {

geminiGs:
`/**
 * AI 질문 중계 (Code.gs)
 * API 키는 코드에 쓰지 않고 '스크립트 속성'에 보관합니다.
 * 프로젝트 설정(⚙️) → 스크립트 속성 → 속성: GEMINI_API_KEY / 값: 내 API 키
 */
const MODEL = 'gemini-flash-latest'; // 항상 최신 Flash 모델을 가리키는 이름이에요. 다른 모델을 쓰려면 여기를 바꾸세요.

function doPost(e) {
  try {
    const question = String(JSON.parse(e.postData.contents).question || '').trim();
    if (!question) return toJson_({ ok: false, message: '질문이 비어 있어요.' });

    const key = PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY');
    if (!key) return toJson_({ ok: false, message: '스크립트 속성에 GEMINI_API_KEY를 먼저 저장해 주세요.' });

    const res = UrlFetchApp.fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent',
      {
        method: 'post',
        contentType: 'application/json',
        headers: { 'x-goog-api-key': key },
        payload: JSON.stringify({ contents: [{ parts: [{ text: question }] }] }),
        muteHttpExceptions: true
      }
    );
    const data = JSON.parse(res.getContentText());
    if (data.error) return toJson_({ ok: false, message: data.error.message });

    const c = data.candidates && data.candidates[0];
    const parts = (c && c.content && c.content.parts) || [];
    const answer = parts.map(function (p) { return p.text || ''; }).join('');
    return toJson_({ ok: true, answer: answer });
  } catch (err) {
    return toJson_({ ok: false, message: String(err) });
  }
}

function toJson_(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`,

gasInGs:
`/**
 * Apps Script 안에 HTML을 넣는 방식 (Code.gs)
 * - 이 프로젝트에 'index'라는 이름의 HTML 파일을 하나 더 만들어 두세요.
 * - 데이터는 스프레드시트의 첫 번째 시트에 저장합니다.
 */

// 웹 앱 주소를 열면 index 화면(HTML)을 보여 줍니다.
function doGet() {
  return HtmlService.createHtmlOutputFromFile('index')
    .setTitle('점수 저장 연습')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');
}

// 화면(HTML)에서 google.script.run으로 부르는 함수 ① 저장
function saveScore(name, score) {
  const lock = LockService.getScriptLock();
  lock.waitLock(10000); // 여러 명이 동시에 저장해도 한 줄씩 차례로 기록
  try {
    const n = String(name || '').trim();
    const s = Number(score);
    if (!n || isNaN(s)) return { ok: false, message: '이름과 점수를 확인해 주세요.' };
    getSheet_().appendRow([n, s, new Date()]);
    return { ok: true };
  } finally {
    lock.releaseLock();
  }
}

// 화면(HTML)에서 부르는 함수 ② 목록 불러오기
function getScores() {
  const values = getSheet_().getDataRange().getValues();
  return values.slice(1).map(function (r) {
    return {
      name: r[0],
      score: r[1],
      time: r[2] ? Utilities.formatDate(new Date(r[2]), 'Asia/Seoul', 'yyyy-MM-dd HH:mm') : ''
    };
  });
}

// 첫 번째 시트를 가져오고, 비어 있으면 제목 줄을 만듭니다.
// (이름 끝에 _가 붙은 함수는 화면에서 부를 수 없는 내부용이에요)
function getSheet_() {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['이름', '점수', '저장 시간']);
  }
  return sheet;
}`,

/* =========================================================
   [상태 관리] localStorage 저장/불러오기
   ========================================================= */
const STORE_KEY = 'vibeCodingTutorialState';
const FS_LEVELS = [
  { id:'s', name:'작게' }, { id:'m', name:'기본' }, { id:'l', name:'크게' }, { id:'xl', name:'매우 크게' }
];

// 모든 하위 항목을 한 줄로 펼친 목록 (이동, 진행률 계산용)
const FLAT = [];
lessons.forEach((L, li) => L.sections.forEach((S, si) => FLAT.push({ L, li, S, si })));
const findIndex = id => FLAT.findIndex(f => f.S.id === id);

const appState = {
  current: FLAT[0].S.id,
  completed: [],
  fontSize: 'm',
  presentationMode: false, // 저장하지 않음 (새로고침 시 해제)
  builder: null,
  errorBuilder: null,
  checklist: [],
  chosenAI: null // 1-1에서 고른 AI (1-2~1-5 중 하나의 id)
};

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (saved && typeof saved === 'object') {
      if (typeof saved.current === 'string') appState.current = saved.current;
      if (Array.isArray(saved.completed)) appState.completed = saved.completed;
      if (typeof saved.fontSize === 'string') appState.fontSize = saved.fontSize;
      if (saved.builder && typeof saved.builder === 'object') appState.builder = saved.builder;
      if (saved.errorBuilder && typeof saved.errorBuilder === 'object') appState.errorBuilder = saved.errorBuilder;
      if (Array.isArray(saved.checklist)) appState.checklist = saved.checklist;
      if (AI_OPTS.some(o => o.id === saved.chosenAI)) appState.chosenAI = saved.chosenAI;
    }
  } catch (e) { /* 저장된 값이 깨졌으면 기본값 사용 */ }
  // 콘텐츠가 바뀌어 없어진 항목은 정리
  if (findIndex(appState.current) < 0) appState.current = FLAT[0].S.id;
  appState.completed = appState.completed.filter(id => findIndex(id) >= 0);
  if (!FS_LEVELS.some(f => f.id === appState.fontSize)) appState.fontSize = 'm';
}

function saveState() {
  try {
    const { presentationMode, ...rest } = appState;
    localStorage.setItem(STORE_KEY, JSON.stringify(rest));
  } catch (e) { /* 저장 공간을 쓸 수 없는 환경이면 조용히 넘어감 */ }
}

/* =========================================================
   [렌더링] 사이드바
   ========================================================= */
const $ = id => document.getElementById(id);

function renderSidebar() {
  const total = FLAT.length;
  const doneCount = appState.completed.length;
  const pct = Math.round(doneCount / total * 100);
  const cur = FLAT[findIndex(appState.current)];

  const toc = lessons.map((L, li) => {
    const ids = L.sections.map(s => s.id);
    const d = ids.filter(id => appState.completed.includes(id)).length;
    const active = cur.li === li;
    const subs = active ? `<ul class="subs">${L.sections.map(S => {
      const isDone = appState.completed.includes(S.id);
      const isCur = S.id === appState.current;
      return `<li><button type="button" class="sub-btn${isCur ? ' current' : ''}" data-go="${S.id}"${isCur ? ' aria-current="page"' : ''}>
        <span class="sub-mark${isDone ? ' done' : ''}" aria-label="${isDone ? '완료' : '미완료'}">${isDone ? '✓' : ''}</span>
        <span>${S.id} ${S.title}</span></button></li>`;
    }).join('')}</ul>` : '';
    return `<li>
      <button type="button" class="lesson-btn${active ? ' active' : ''}" data-go="${L.sections[0].id}" aria-expanded="${active}">
        <span class="lesson-ico" aria-hidden="true">${L.icon}</span>
        <span class="lesson-txt"><b>${L.label} ${L.title}</b><small>⏱ ${L.duration}</small></span>
        <span class="lesson-count${d === ids.length ? ' full' : ''}" aria-label="${ids.length}개 중 ${d}개 완료">${d}/${ids.length}</span>
      </button>${subs}</li>`;
  }).join('');

  $('sidebar').innerHTML = `
    <div class="progress-box" role="group" aria-label="진행률">
      <div class="progress-top"><span>진행률</span><span>${pct}%</span></div>
      <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-sub">${total}개 중 ${doneCount}개 완료</div>
    </div>
    <nav aria-label="단계 목록"><ul class="toc">${toc}</ul></nav>
    <div class="side-foot">
      <button type="button" class="reset-btn" id="resetBtn">↺ 진행 상태 초기화</button>
      <p class="side-hint">⌨️ 키보드 ← → 로 단계를 이동할 수 있어요.<br>진행 상태는 이 기기의 브라우저에 저장돼요.</p>
    </div>`;
}

/* =========================================================
   [렌더링] 본문
   ========================================================= */
function renderMain(focusTitle) {
  const idx = findIndex(appState.current);
  const { L, S } = FLAT[idx];
  const isDone = appState.completed.includes(S.id);

  document.body.className = document.body.className.replace(/\btheme-\d\b/g, '').trim() + ' ' + L.theme;

  $('article').innerHTML = `
    <div class="crumb"><span class="stage">${L.icon} ${L.label} ${L.title}</span><span class="dur">${L.duration}</span></div>
    <div class="page-title"><span class="page-num">${S.id}</span><h1 id="pageTitle" tabindex="-1">${S.title}</h1></div>
    <div class="section-body">${S.content}</div>
    <div class="done-wrap">
      <button type="button" class="done-btn${isDone ? ' is-done' : ''}" id="doneBtn" aria-pressed="${isDone}">
        ${isDone ? '✓ 완료했어요 (다시 누르면 취소)' : '✓ 이 단계 완료'}
      </button>
    </div>${S.afterDone || ''}`;

  $('prevBtn').disabled = idx === 0;
  $('nextBtn').disabled = idx === FLAT.length - 1;
  $('pos').textContent = `${idx + 1} / ${FLAT.length}`;
  document.title = `${S.id} ${S.title} | 바이브코딩 튜토리얼`;

  if (typeof S.mount === 'function') S.mount();
  if (focusTitle) {
    // 맨 위로 '바로' 이동 (부드러운 스크롤을 끄고), 휴대폰 웹뷰가 초점 이동 때 다시 스크롤해도 맨 위로 되돌림
    scrollTopNow();
    const t = $('pageTitle');
    if (t) t.focus({ preventScroll: true });
    scrollTopNow();
    requestAnimationFrame(scrollTopNow);
    setTimeout(scrollTopNow, 120);
  }
}

function scrollTopNow() {
  const root = document.documentElement;
  const prev = root.style.scrollBehavior;
  root.style.scrollBehavior = 'auto';
  window.scrollTo(0, 0);
  root.style.scrollBehavior = prev;
}

function renderAll(focusTitle) {
  renderSidebar();
  renderMain(focusTitle);
}

/* =========================================================
   [이동]
   ========================================================= */
function goTo(id) {
  if (findIndex(id) < 0) return;
  appState.current = id;
  saveState();
  closeSidebarOnMobile();
  renderAll(true);
}
function move(step) {
  const idx = findIndex(appState.current) + step;
  if (idx >= 0 && idx < FLAT.length) goTo(FLAT[idx].S.id);
}

function toggleDone() {
  const id = appState.current;
  const i = appState.completed.indexOf(id);
  if (i >= 0) {
    // 이미 완료한 단계를 다시 누르면 완료 취소 (이동하지 않음)
    appState.completed.splice(i, 1);
    saveState();
    renderAll(false);
    const btn = $('doneBtn');
    if (btn) btn.focus();
    return;
  }
  appState.completed.push(id);
  saveState();
  // 완료하면 자동으로 다음 단계로 (단계에 따라 가야 할 곳이 다르면 doneGo가 알려 줌)
  const idx = findIndex(id);
  const S = FLAT[idx].S;
  let target = typeof S.doneGo === 'function' ? S.doneGo() : null;
  if (!target || findIndex(target) < 0) target = idx + 1 < FLAT.length ? FLAT[idx + 1].S.id : null;
  if (target) {
    goTo(target);
    showToast('✓ 완료! 다음 단계로 이동했어요.');
  } else {
    renderAll(false);
    showToast('🎉 마지막 단계까지 모두 완료했어요!');
  }
}

/* =========================================================
   [복사] Clipboard API → textarea 대체 → 실패 안내
   ========================================================= */
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function copyText(text, btn) {
  let ok = false;
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
  }
  if (!ok) ok = fallbackCopy(text);

  if (ok) {
    const original = btn.dataset.label || btn.innerHTML;
    btn.dataset.label = original;
    btn.innerHTML = '✓ 복사됨!';
    btn.classList.add('copied');
    clearTimeout(btn._timer);
    btn._timer = setTimeout(() => { btn.innerHTML = original; btn.classList.remove('copied'); }, 1800);
  } else {
    showToast('복사가 되지 않았어요. 코드를 드래그해서 직접 복사해 주세요.');
  }
}

let toastTimer;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* =========================================================
   [글자 크기]
   ========================================================= */
function applyFont() {
  document.documentElement.dataset.fs = appState.fontSize;
  const i = FS_LEVELS.findIndex(f => f.id === appState.fontSize);
  $('fsLabel').textContent = FS_LEVELS[i].name;
  $('fsDown').disabled = i === 0;
  $('fsUp').disabled = i === FS_LEVELS.length - 1;
}
function changeFont(step) {
  const i = FS_LEVELS.findIndex(f => f.id === appState.fontSize) + step;
  if (i < 0 || i >= FS_LEVELS.length) return;
  appState.fontSize = FS_LEVELS[i].id;
  saveState();
  applyFont();
}

/* =========================================================
   [사이드바 열기/닫기 + 발표 모드]
   ========================================================= */
const isNarrow = () => window.matchMedia('(max-width:900px)').matches;

function toggleSidebar() {
  if (isNarrow()) document.body.classList.toggle('side-open');
  else document.body.classList.toggle('side-collapsed');
  syncMenuBtn();
}
function closeSidebarOnMobile() {
  if (document.body.classList.contains('side-open')) {
    document.body.classList.remove('side-open');
    syncMenuBtn();
  }
}
function syncMenuBtn() {
  const open = isNarrow() ? document.body.classList.contains('side-open') : !document.body.classList.contains('side-collapsed');
  $('menuBtn').setAttribute('aria-expanded', String(open));
}

function setPresentation(on) {
  appState.presentationMode = on;
  document.body.classList.toggle('pres', on);
  $('presBtn').setAttribute('aria-pressed', String(on));
  $('presBtn').querySelector('.txt').textContent = on ? '발표 종료' : '발표 모드';
  if (on) document.body.classList.remove('side-open');
  syncMenuBtn();
}

/* =========================================================
   [초기화 확인창]
   ========================================================= */
let lastFocus = null;
function openModal() {
  lastFocus = document.activeElement;
  $('modal').classList.add('show');
  $('modalCancel').focus();
}
function closeModal() {
  $('modal').classList.remove('show');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function resetProgress() {
  appState.completed = [];
  appState.checklist = [];
  appState.chosenAI = null;
  appState.current = FLAT[0].S.id;
  saveState();
  closeModal();
  renderAll(true);
  showToast('진행 상태를 초기화했어요.');
}

/* =========================================================
   [도우미 1] 프롬프트 만들기 (0-3)
   ========================================================= */
function defaultBuilder() {
  return { topic:'', who:0, dev:[0, 1], feat:'', cond:PB_COND.map((_, i) => i), plan:false };
}

function buildPrompt(b) {
  const topic = b.topic.trim() || '[만들고 싶은 앱]';
  const feats = b.feat.split('\n').map(s => s.trim()).filter(Boolean);
  const devs = b.dev.map(i => PB_DEV[i]).filter(Boolean);
  const conds = b.cond.map(i => PB_COND[i]).filter(Boolean);
  const lines = [];
  lines.push('당신은 교사를 위한 교육용 웹앱을 만드는 친절한 프론트엔드 개발자입니다.');
  lines.push('');
  lines.push("수업 시간에 사용할 '" + topic + "' 웹앱을 만들어 주세요.");
  lines.push('');
  lines.push('[사용하는 사람]');
  lines.push('- ' + (PB_WHO[b.who] || PB_WHO[0]));
  if (devs.length) {
    lines.push('');
    lines.push('[사용 기기]');
    lines.push('- ' + devs.join(', '));
  }
  lines.push('');
  lines.push('[꼭 필요한 기능]');
  if (feats.length) feats.forEach(f => lines.push('- ' + f));
  else lines.push('- [필요한 기능을 한 줄에 하나씩 적어 주세요]');
  if (conds.length) {
    lines.push('');
    lines.push('[조건]');
    conds.forEach(c => lines.push('- ' + c));
  }
  if (b.plan) {
    lines.push('');
    lines.push('[진행 방법]');
    lines.push('1. 바로 코드를 쓰지 말고, 먼저 화면 구성과 기능 목록을 짧게 정리해서 보여 주세요.');
    lines.push('2. 제 아이디어와 다르거나 빠진 부분이 있으면 질문해 주세요.');
    lines.push('3. 제가 확인하면 그때 전체 코드를 만들어 주세요.');
  }
  return lines.join('\n');
}

function mountPromptBuilder() {
  const root = $('pb');
  if (!root) return;
  const b = Object.assign(defaultBuilder(), appState.builder || {});

  $('pb-topic').value = b.topic;
  $('pb-who').value = String(b.who);
  $('pb-feat').value = b.feat;
  $('pb-plan').checked = !!b.plan;
  root.querySelectorAll('[data-pb-dev]').forEach(el => { el.checked = b.dev.includes(Number(el.dataset.pbDev)); });
  root.querySelectorAll('[data-pb-cond]').forEach(el => { el.checked = b.cond.includes(Number(el.dataset.pbCond)); });

  const collect = () => ({
    topic: $('pb-topic').value,
    who: Number($('pb-who').value),
    feat: $('pb-feat').value,
    plan: $('pb-plan').checked,
    dev: [...root.querySelectorAll('[data-pb-dev]:checked')].map(el => Number(el.dataset.pbDev)),
    cond: [...root.querySelectorAll('[data-pb-cond]:checked')].map(el => Number(el.dataset.pbCond))
  });
  const update = () => {
    appState.builder = collect();
    saveState();
    $('pb-out').textContent = buildPrompt(appState.builder);
  };

  root.addEventListener('input', update);
  root.addEventListener('change', update);
  root.querySelectorAll('[data-idea]').forEach(btn => btn.addEventListener('click', () => {
    const idea = IDEAS[Number(btn.dataset.idea)];
    $('pb-topic').value = idea.name;
    $('pb-feat').value = idea.feat;
    update();
    showToast(idea.icon + ' ' + idea.name + ' 예시를 채웠어요. 원하는 대로 고쳐 보세요.');
  }));
  $('pb-out').textContent = buildPrompt(b);
}

/* =========================================================
   [도우미 2] 오류 질문 만들기 (1-7)
   ========================================================= */
function buildErrorPrompt(e) {
  const lines = [];
  lines.push('당신이 만들어 준 웹앱을 실행했는데 문제가 생겼습니다.');
  lines.push('');
  lines.push('[문제 종류]');
  lines.push(EB_TYPES[e.type] || EB_TYPES[0]);
  lines.push('');
  lines.push('[지금 보이는 현상]');
  lines.push(e.now.trim() || '[지금 화면에서 보이는 모습을 적어 주세요]');
  lines.push('');
  lines.push('[원래 원했던 것]');
  lines.push(e.want.trim() || '[원래 어떻게 되어야 하는지 적어 주세요]');
  lines.push('');
  lines.push('[에러 메시지]');
  lines.push(e.msg.trim() || '없음');
  lines.push('');
  lines.push('기존 기능은 최대한 유지하면서, 문제의 원인을 코딩을 모르는 사람도 이해할 수 있게 먼저 설명하고 수정해 주세요.');
  lines.push('수정된 전체 코드를 생략 없이 다시 제공해 주세요.');
  return lines.join('\n');
}

function mountErrorBuilder() {
  const root = $('eb');
  if (!root) return;
  const e = Object.assign({ type:0, now:'', want:'', msg:'' }, appState.errorBuilder || {});
  $('eb-type').value = String(e.type);
  $('eb-now').value = e.now;
  $('eb-want').value = e.want;
  $('eb-msg').value = e.msg;
  const update = () => {
    appState.errorBuilder = { type:Number($('eb-type').value), now:$('eb-now').value, want:$('eb-want').value, msg:$('eb-msg').value };
    saveState();
    $('eb-out').textContent = buildErrorPrompt(appState.errorBuilder);
  };
  root.addEventListener('input', update);
  root.addEventListener('change', update);
  $('eb-out').textContent = buildErrorPrompt(e);
}

/* =========================================================
   [도우미 3] 미니 프로젝트 체크리스트 (5-1)
   ========================================================= */
function mountChecklist() {
  const root = $('checklist');
  if (!root) return;
  const boxes = [...root.querySelectorAll('[data-ck]')];
  const count = () => {
    const n = appState.checklist.length;
    $('ck-count').textContent = `${CHECKLIST.length}개 중 ${n}개 완료` + (n === CHECKLIST.length ? ' 🎉 모두 완료했어요!' : '');
  };
  boxes.forEach(el => { el.checked = appState.checklist.includes(Number(el.dataset.ck)); });
  root.addEventListener('change', () => {
    appState.checklist = boxes.filter(el => el.checked).map(el => Number(el.dataset.ck));
    saveState();
    count();
  });
  count();
}

/* =========================================================
   [도우미 4] 1-1 AI 고르기 / 1-2~1-5 내 프롬프트 불러오기
   ========================================================= */
function updateAiPick() {
  const id = appState.chosenAI;
  document.querySelectorAll('[data-ai]').forEach(b => {
    const on = b.dataset.ai === id;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  });
  const opt = AI_OPTS.find(o => o.id === id);
  const res = $('aiResult');
  if (res) {
    res.innerHTML = opt
      ? `👉 <b>${opt.id} ${opt.name}</b>로 가세요.`
      : '버튼을 눌러 사용할 AI를 골라 주세요. (처음이라면 제미나이를 추천해요)';
  }
  const jump = $('aiJump');
  if (jump) {
    jump.innerHTML = opt
      ? `<button type="button" class="jump-btn" data-go="${opt.id}">👉 ${opt.id} ${opt.name}로 바로 이동하기</button>`
      : '';
  }
}

// 0-3에서 프롬프트를 만들었는지 (앱 이름을 적었으면 만든 것으로 봄)
function hasMyPrompt() {
  const b = appState.builder;
  return !!(b && typeof b.topic === 'string' && b.topic.trim());
}

function mountMyPrompt() {
  const code = $('myp');
  if (!code) return;
  const mine = hasMyPrompt();
  code.textContent = mine ? buildPrompt(Object.assign(defaultBuilder(), appState.builder)) : CODES.firstPrompt;
  $('myp-label').textContent = mine ? '내 프롬프트 (0-3에서 만든 것)' : '기본 예시 프롬프트: 랜덤 발표자 뽑기';
  document.querySelectorAll('.myp-need').forEach(el => {
    el.textContent = mine ? '0-3에서 만든 프롬프트 (아래에서 복사)' : '프롬프트 (아래 기본 예시를 복사)';
  });
  const note = $('myp-note');
  if (note) {
    note.innerHTML = mine ? '' : '<p>아직 0-3에서 프롬프트를 만들지 않았어요. 기본 예시로 연습하거나, <button type="button" class="chip" data-go="0-3">🪄 0-3에서 내 프롬프트 만들기</button></p>';
  }
}

/* =========================================================
   [이벤트 연결]
   ========================================================= */
document.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]');
  if (go) { goTo(go.dataset.go); return; }

  const ai = ev.target.closest('[data-ai]');
  if (ai) { appState.chosenAI = ai.dataset.ai; saveState(); updateAiPick(); return; }

  const cp = ev.target.closest('[data-copy]');
  if (cp) { copyText(CODES[cp.dataset.copy] || '', cp); return; }

  const cpe = ev.target.closest('[data-copy-el]');
  if (cpe) { const el = $(cpe.dataset.copyEl); copyText(el ? el.textContent : '', cpe); return; }

  if (ev.target.closest('#doneBtn')) { toggleDone(); return; }
  if (ev.target.closest('#resetBtn')) { openModal(); return; }
});

$('menuBtn').addEventListener('click', toggleSidebar);
$('backdrop').addEventListener('click', closeSidebarOnMobile);
$('prevBtn').addEventListener('click', () => move(-1));
$('nextBtn').addEventListener('click', () => move(1));
$('fsDown').addEventListener('click', () => changeFont(-1));
$('fsUp').addEventListener('click', () => changeFont(1));
$('presBtn').addEventListener('click', () => setPresentation(!appState.presentationMode));
$('modalCancel').addEventListener('click', closeModal);
$('modalOk').addEventListener('click', resetProgress);
$('modal').addEventListener('click', ev => { if (ev.target === $('modal')) closeModal(); });

document.addEventListener('keydown', ev => {
  const modalOpen = $('modal').classList.contains('show');
  if (ev.key === 'Escape') {
    if (modalOpen) closeModal();
    else if (document.body.classList.contains('side-open')) closeSidebarOnMobile();
    else if (appState.presentationMode) setPresentation(false);
    return;
  }
  if (modalOpen) {
    // 확인창 안에서만 Tab 이동
    if (ev.key === 'Tab') {
      const f = [$('modalCancel'), $('modalOk')];
      const i = f.indexOf(document.activeElement);
      ev.preventDefault();
      f[(i + (ev.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
    return;
  }
  const tag = (ev.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || ev.target.isContentEditable) return;
  if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.key === 'ArrowRight') { ev.preventDefault(); move(1); }
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); move(-1); }
});

window.addEventListener('resize', () => {
  if (!isNarrow()) document.body.classList.remove('side-open');
  syncMenuBtn();
});

/* =========================================================
   [시작]
   ========================================================= */
loadState();
applyFont();
renderAll(false);
syncMenuBtn();
</script>
